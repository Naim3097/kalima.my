# The fast marketplace-sync lane: drains the stock-push queue and polls Shopee
# and TikTok Shop for orders whose webhook never arrived.
#
# WHY THIS IS NOT A VERCEL CRON. The project is on Vercel's Hobby plan, which
# allows at most one cron run per day — a sub-daily expression in vercel.json
# fails the BUILD, not just the cron. The nightly deep sweep (?reconcile=1)
# stays in vercel.json; this drives the 5-minute lane from outside.
#
# If the project ever moves to Vercel Pro, delete this file and add
#   { "path": "/api/channels/sync", "schedule": "*/5 * * * *" }
# to vercel.json. The endpoint is identical either way.
#
# HONEST CADENCE: GitHub delays scheduled workflows under load, sometimes by
# 10+ minutes, and drops them entirely during incidents. That is acceptable
# here because nothing depends on this being punctual — the queue is durable,
# a late run picks up everything waiting, and the nightly reconcile catches
# whatever a skipped run missed. It would NOT be acceptable as the only
# mechanism, which is why it is not.

name: Marketplace sync

on:
  schedule:
    # Every 5 minutes. Note that GitHub only runs schedules on the DEFAULT
    # branch — this has no effect until it is merged to main.
    - cron: "*/5 * * * *"
  # So a human can force the fast lane from the Actions tab without waiting.
  workflow_dispatch:

# A slow run must not overlap the next tick. Postgres would cope — claim_sync_jobs
# uses `for update skip locked` precisely so two workers cannot take the same job —
# but overlapping runs still double our request rate against a rate-limited
# marketplace for no gain.
concurrency:
  group: channel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drain queue and poll for orders
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::SYNC_URL and CRON_SECRET must both be set as repository secrets."
            exit 1
          fi

          # --fail-with-body so a non-2xx is a red run AND still prints why.
          # -sS keeps the progress meter out of the log but shows real errors.
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120 \
            "${SYNC_URL}/api/channels/sync"
