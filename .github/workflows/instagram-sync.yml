# Refreshes the homepage Lookbook from Instagram: pulls the latest posts,
# mirrors their photographs into Storage, and drops posts no longer on the feed.
#
# WHY THIS IS NOT A VERCEL CRON. vercel.json already carries two entries, and
# the project is on Vercel's Hobby plan, which caps a project at two cron jobs —
# a third fails the BUILD, not just the cron. channel-sync.yml already solves
# this same problem for the marketplace fast lane.
#
# If the project ever moves to Vercel Pro, delete this file and add
#   { "path": "/api/instagram/sync", "schedule": "0 2 * * *" }
# to vercel.json. The endpoint is identical either way.
#
# HONEST CADENCE: GitHub delays scheduled workflows under load and drops them
# during incidents. That is fine here — a lookbook that refreshes late, or skips
# a day, shows slightly older photography and nothing else. Staff have
# "Refresh now" in Admin › Content for the moment it actually matters.

name: Instagram sync

on:
  schedule:
    # 02:00 UTC = 10:00 MYT, so a post made overnight is up before the shop's
    # day starts. Note that GitHub only runs schedules on the DEFAULT branch —
    # this has no effect until it is merged to main.
    - cron: "0 2 * * *"
  # So a human can force a refresh from the Actions tab.
  workflow_dispatch:

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull the latest Instagram posts
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::SYNC_URL and CRON_SECRET must both be set as repository secrets."
            exit 1
          fi

          # --fail-with-body so a non-2xx is a red run AND still prints why.
          # The timeout is generous because the first run mirrors every image.
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 300 \
            "${SYNC_URL}/api/instagram/sync"
